name: Tests

on:
  push:
    branches: [master, pest-tests]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres, not SQLite - this schema uses native Postgres
    # enums, so testing against SQLite would pass locally while
    # masking real Postgres-specific bugs before they hit production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: counselos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, pdo_pgsql, mbstring, zip, gd
          coverage: none

      - name: Copy testing environment file
        run: cp .env.testing .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1

      - name: Run Pest test suite
        run: ./vendor/bin/pest --ci
        env:
          DB_HOST: 127.0.0.1
