models:
  Client:
    user_id: id foreign:users
    name: string
    email: string nullable
    phone: string nullable
    organization: string nullable
    address: text nullable
    notes: text nullable
    archived_at: timestamp nullable
    relationships:
      hasMany: Matter

  Matter:
    client_id: id foreign:clients
    title: string
    description: text nullable
    practice_area: string nullable
    status: enum:open,in_review,waiting_client,closed default:open
    opened_at: timestamp nullable
    closed_at: timestamp nullable
    relationships:
      hasMany: Document, Task, ResearchSession, ActivityLog

  Document:
    matter_id: id foreign:matters
    uploaded_by: id foreign:users
    filename: string
    original_name: string
    storage_path: string
    mime_type: string
    file_size: integer
    document_type: enum:contract,lease,title_deed,correspondence,research,other
    extracted_text: longtext nullable
    processing_status: enum:uploaded,extracting,analysis_pending,analyzed,failed default:uploaded
    error_message: text nullable
    relationships:
      hasOne: DocumentInsight

  DocumentInsight:
    document_id: id foreign:documents
    summary: text nullable
    key_parties_json: json nullable
    key_clauses_json: json nullable
    risks_json: json nullable
    obligations_json: json nullable
    deadlines_json: json nullable
    questions_json: json nullable
    model_name: string nullable
    raw_ai_response: longtext nullable

  Task:
    matter_id: id foreign:matters
    source_document_id: id foreign:documents nullable
    title: string
    description: text nullable
    due_date: date nullable
    status: enum:open,in_progress,done default:open
    priority: enum:low,medium,high default:medium
    created_by: id foreign:users
    completed_at: timestamp nullable

  ResearchSession:
    matter_id: id foreign:matters
    user_id: id foreign:users
    query: text
    response: longtext nullable
    sources_json: json nullable
    model_name: string nullable

  ActivityLog:
    user_id: id foreign:users
    matter_id: id foreign:matters nullable
    subject_type: string nullable
    subject_id: unsignedBigInteger nullable
    action: string
    description: string
    metadata_json: json nullable

controllers:
  Dashboard:
    index:
      query: all
      render: dashboard

  Client:
    resource: web

  Matter:
    resource: web

  # NOTE: Document generated as a flat resourceful controller for the
  # index/show/store/destroy skeleton only. The routes below in web.php
  # must be manually nested under /matters/{matter}/documents to match
  # the API contract in the spec (Section 15). Non-CRUD actions
  # (extract, analyze) are NOT generated by Blueprint - add them by hand
  # to DocumentController after generation.
  Document:
    resource: web

  # NOTE: same nesting caveat as Document - Task routes must be moved
  # under /matters/{matter}/tasks manually after generation.
  Task:
    resource: web

  # Research is matter-scoped only (no independent index/show/edit views
  # per the spec), so a resourceful controller is unnecessary. Generating
  # a bare controller here as a starting point; the real logic
  # (buildMatterContext, answerQuestion, saveSession) belongs in

